name: Release

# Builds the seed compilers (klarc for Linux x86-64, Linux arm64, Windows x86-64 and, experimental, macOS x86-64) and attaches them to the GitHub
# release of a tag. With them, `build.sh` / `build.bat` build Klar without Python. Start it by hand (Actions → Release
# → Run workflow) with the tag, e.g. v1.0.0, after pushing that tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap check (klarc builds itself, byte for byte)
        run: python tests/bootstrap.py
      - name: Seed compilers
        run: |
          mkdir dist
          python -m klar build compiler/klarc.klar -o dist/klarc-linux --target linux
          python -m klar build compiler/klarc.klar -o dist/klarc-linux-arm64 --target linux-arm64
          python -m klar build compiler/klarc.klar -o dist/klarc-windows.exe --target windows
          python -m klar build compiler/klarc.klar -o dist/klarc-macos --target macos
          # the seeds reproduce themselves: klarc-linux builds the same four files
          for t in linux linux-arm64 windows macos; do
            out=check-$t; [ $t = windows ] && out=check-$t.exe
            dist/klarc-linux build compiler/klarc.klar -o $out --target $t --lib klar
          done
          cmp check-linux dist/klarc-linux
          cmp check-linux-arm64 dist/klarc-linux-arm64
          cmp check-windows.exe dist/klarc-windows.exe
          cmp check-macos dist/klarc-macos
          (cd dist && sha256sum klarc-* > SHA256SUMS)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "See CHANGELOG.md."
          gh release upload "${{ inputs.tag }}" dist/* --clobber
