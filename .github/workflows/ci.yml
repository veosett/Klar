name: CI

# Automatic runs are off: start the workflow by hand (Actions → CI → Run workflow).
# To turn them back on, add `push:` and `pull_request:` under `on:`.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compiler test-suite (front-end, 3 back-ends, tools, compile-time safety)
        run: python -m unittest discover -s tests -v
      - name: Native back-end == reference interpreter
        run: python tests/native_diff.py
      - name: Self-hosting (Klar lexer == Python lexer)
        run: python tests/selfhost.py
      - name: Example programs
        run: |
          python -m klar test examples/bank.klar
          python -m klar run examples/features.klar
          python -m klar build examples/shapes.klar -o shapes-bin

  vscode:
    # the VS Code extension against a real VS Code: diagnostics, hover, definition, completion, references, quick fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extension end-to-end test
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          xvfb-run -a npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check klar tests bench
      - run: python -m klar fmt --check .
